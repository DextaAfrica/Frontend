name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        # registry.npmjs.org's audit endpoint returns a bare 503 now and
        # then — an outage on npm's side, not a finding about this repo —
        # and `npm audit` treats that the same as a real high/critical
        # result: non-zero exit, no distinction in the exit code alone.
        # Retrying rides out the transient case; a genuine vulnerability
        # doesn't go away on retry, so it still fails, just after a few
        # extra seconds rather than a wasted CI run over an npm outage.
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt ${attempt} failed" >&2
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "npm audit failed after 3 attempts" >&2
          exit 1
      - name: Run quality gates
        run: npm run check

  application-build:
    name: Production application build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build standalone application
        run: npm run build
      - name: Verify standalone server
        run: test -f .next/standalone/server.js

  container-build:
    name: Production container build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate Compose manifests
        run: |
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.prod.yaml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: false
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          tags: dexta-africa-web:ci

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: dexta-africa-web:development
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
      WATCHPACK_POLLING_INTERVAL: "${WATCHPACK_POLLING_INTERVAL:-500}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      CONTENT_API_URL: "${CONTENT_API_URL:-}"
      CONTENT_API_TOKEN: "${CONTENT_API_TOKEN:-}"
      CONTENT_REVALIDATION_SECRET: "${CONTENT_REVALIDATION_SECRET:-}"
      NEWSLETTER_WEBHOOK_URL: "${NEWSLETTER_WEBHOOK_URL:-}"
      NEWSLETTER_WEBHOOK_TOKEN: "${NEWSLETTER_WEBHOOK_TOKEN:-}"
      CONTACT_WEBHOOK_URL: "${CONTACT_WEBHOOK_URL:-}"
      CONTACT_WEBHOOK_TOKEN: "${CONTACT_WEBHOOK_TOKEN:-}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  node_modules:
